  #       min-idle: 0 # 连接池中的最小空闲连接
  #       max-idle: 8 # 连接池中的最大空闲连接


  # 数据源  
  datasource:
    # 数据库类型(可选值 MySQL、SQLServer、Oracle、DM、KingbaseES、PostgreSQL，请严格按可选值填写)
    db-type: MySQL
    db-name: jnpf_init
    host: 39.105.25.198
    port: 3306
    username: root
    password: 48b6d42175daeb80
    db-schema: #金仓达梦选填
    prepare-url: #自定义url
    # 表空间(当数据库为Oracle、达梦DM、金仓KingbaseES时表空间必须指定，其他数据库为空即可)
    tablespace: 
    # 多数据源配置
    dynamic:
      seata: false
      # 设置默认的数据源或者数据源组,默认值即为master
      primary: master 
      # 严格匹配数据源,默认false. true未匹配到指定数据源时抛异常,false使用默认数据源
      strict: true 
      druid:
        # 空闲时执行连接测试
        test-while-idle: true
        # 连接测试最小间隔
        time-between-eviction-runs-millis: 60000
        # 获取连接等待3秒 根据网络情况设定
        max-wait: 3000
        # 初始化4个连接
        initial-size: 4
        # 最大20个连接
        max-active: 20
        # 最少保持4个空闲连接
        min-idle: 4
        # 空闲连接保活, 超过配置的空闲时间会进行连接检查完成保活操作(数据库自身会断开达到空闲时间的连接， 程序使用断开的连接会报错)
        keep-alive: true
        # 连接超时
        connect-timeout: 10000
        # 连接超时
        socket-timeout: 10000
        # 查询超时
        query-timeout: 90000
        # 事务查询超时
        transaction-query-timeout: 90000
        # 解除注释后Druid连接池打印SQL语句 忽略日志等级配置
        #filters: slf4j
        slf4j:
          statementLogEnabled: true
          resultSetLogEnabled: false
          connectionLogEnabled: false
          dataSourceLogEnabled: false
          statementCreateAfterLogEnabled: false
          statementCloseAfterLogEnabled: false
          statementExecuteAfterLogEnabled: false
          #打印SQL替换参数
          statementExecutableSqlLogEnable: true
          statementPrepareAfterLogEnabled: false
          statementPrepareCallAfterLogEnabled: false
          statementParameterSetLogEnabled: false
