spring:
  # redis单机模式
  redis:
    #缓存库编号
    database: 0
    host: 39.105.25.198
    port: 6379
    # password: 123456 # 密码为空时，请将本行注释
    timeout: 3000 #超时时间(单位：秒)
    lettuce: #Lettuce为Redis的Java驱动包
      pool:
        max-active: 8 # 连接池最大连接数
        max-wait: -1ms  # 连接池最大阻塞等待时间（使用负值表示没有限制）
        min-idle: 0 # 连接池中的最小空闲连接
        max-idle: 8 # 连接池中的最大空闲连接

  # redis集群模式
  # redis:
  #   cluster:
  #     nodes:
  #       - 192.168.0.225:6380
  #       - 192.168.0.225:6381
  #       - 192.168.0.225:6382
  #       - 192.168.0.225:6383
  #       - 192.168.0.225:6384
  #       - 192.168.0.225:6385
