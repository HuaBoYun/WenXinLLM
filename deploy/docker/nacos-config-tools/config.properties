# ============================================================
# Nacos 配置工具连接参数(config-export / config-import 共用)
# 修改本文件后,直接运行导出或导入脚本即可
# ============================================================

# Nacos 服务地址(部署机上访问,默认容器已把 30099 映射到宿主机)
NACOS_SERVER=http://127.0.0.1:30099

# Nacos 登录账号(需与服务 bootstrap.yml 中一致,默认 nacos/nacos)
NACOS_USERNAME=nacos
NACOS_PASSWORD=nacos

# JNPF 业务命名空间 ID(各服务 jar 内写死了该 ID,勿修改)
NACOS_NAMESPACE_ID=69c4eecb-05bd-4041-81fe-1473f95f578c
NACOS_NAMESPACE_NAME=JNPF

# Nacos 服务端内部鉴权头(取自 nacos 的 conf/application.properties,
# 当账号登录失败时,脚本会自动改用该鉴权头访问接口)
NACOS_IDENTITY_KEY=4hwOSg7xkolSwJ0g
NACOS_IDENTITY_VALUE=STcnk19WJyMSMQYj
