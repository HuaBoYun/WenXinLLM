# ============================================================
# 计费系统配置
# ============================================================
billing:
  # 计费模式切换（二选一）：
  #   cloud   = 云端版：只记录计费，余额不足时登录弹窗提示，不阻断使用
  #   offline = 离线版：余额不足时阻断登录，必须密钥充值后才能使用
  mode: cloud
  enabled: true              # 是否启用计费（false=关闭所有计费）
  deduplicate-seconds: 10    # 防重复计费时间窗口（秒）
  default-fee-amount: 1.0    # 未配置单价的页面默认计费金额（元/次）
  init-amount: 3000          # 新公司初始赠送额度（元）
  warning-threshold: 100     # 余额预警阈值（元），余额<=此值时弹窗提示
  aes-key: REDACTED# 余额加密密钥（勿随意修改）
  hmac-key: RedactedHmac1234 # 密钥充值HMAC密钥（勿随意修改）