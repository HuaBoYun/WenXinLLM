server:
  port: 8763

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  springdoc:
    swagger-ui:
      enabled: true
    api-docs:
      enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json



auditguidelines:
  ssoApiUrl: http://192.0.2.11:48080
  ssoJedisKey: auditToken
  ssoLoginUrl: /admin-api/system/auth/ssoLogin
  ssoLoginUser: ssoToken
  ssoLoginPwd: REDACTED
  guidanceClassUrl: /admin-api/audit/guidance-classification/getAuditObjectClassification
  procedureClassUrl: /admin-api/audit/guidance-classification/getAuditProgramMethodGuidelinesTree
  regulationClassUrl: /admin-api/audit/guidance-classification/getAuditRegulationGuidelinesTree
  qualitativePageUrl: /admin-api/audit/qualitative-dict/page
  qualitativeGetUrl: /admin-api/audit/qualitative-dict/get
  guidancePageUrl: /admin-api/audit/document/findPage
  searchUrl: /admin-api/audit/document/search
  searchContentUrl: /admin-api/audit/document/getContent
  excelPreviewUrl: /admin-api/audit/document/excelPreview
  pdfPreviewUrl: /admin-api/audit/document/pdfPreview
  wordPreviewUrl: /admin-api/audit/document/wordPreview



# ============================================================
http-client:
  max-total: 200                    # 最大连接数
  max-per-route: 20                 # 每个路由最大连接数
  connect-timeout: 5000             # 连接超时（毫秒）
  socket-timeout: 30000             # 读超时（毫秒）
  connection-request-timeout: 5000  # 从连接池获取连接超时（毫秒）

# ============================================================
# WenxinAgent 智能体平台配置（SSO + 应用创建 + 对话流式）
# Console API 用于 SSO 登录、创建应用、查/建 API Key（需要 WenxinAgent access_token）
# Service API 用于实际对话调用（需要应用专属 app-xxx API Key）
wenxinAgent:
  console-api-url: http://127.0.0.1:80/console/api
  service-api-url: http://127.0.0.1:80/v1
  connect-timeout: 10000     # 连接 WenxinAgent 超时（毫秒）
  read-timeout: 600000       # 流式对话读超时 10 分钟