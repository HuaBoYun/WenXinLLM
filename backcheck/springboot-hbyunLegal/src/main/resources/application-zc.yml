  ip-address: 127.0.0.1
  instance-id: hbyunLegalModule-8064
  prefer-ip-address: true
  hostname: hbyun-legal-service
 client:
  register-with-eureka: false
  fetch-registry: false
  serviceUrl:
   defaultZone: http://hbyunadmin:hbEureka12345@127.0.0.1:8761/eureka
security:
  basic:
    enabled: false

