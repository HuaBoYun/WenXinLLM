spring:
  application:
    name: hbyunRiskControl #应用名称
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    #Oracle数据库配置
    oracle:
      url: jdbc:oracle:thin:@192.0.2.200:1521/ORCLPDB
      username: HBGRCPLUS
      password: HBGRCPLUS
      driverClassName: oracle.jdbc.driver.OracleDriver
  druid:
    oracle:
      initialSize: 5
      minIdle: 5
      maxActive: 20
      maxWait: 60000
      timeBetweenEvictionRunsMillis: 60000
      minEvictableIdleTimeMillis: 300000
      validationQuery: SELECT 1 FROM DUAL
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      poolPreparedStatement: true
      maxPoolPreparedStatementPerConnectionSize: 20
      filters: stat,wall,log4j
      connectionProperties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000

    #Mysql数据库配置
    mysql:
      url: jdbc:mysql://192.0.2.200:3306/hbgrcccc?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&serverTimezone=GMT%2B8
