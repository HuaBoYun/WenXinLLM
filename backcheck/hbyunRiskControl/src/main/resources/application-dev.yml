  ip-address: 192.0.2.200
  instance-id: hbyunRisk-8082
  prefer-ip-address: true
  hostname: hbyun-risk-service
 client:
  serviceUrl:
   defaultZone: http://hbyunadmin:REDACTED@127.0.0.1:8761/eureka
