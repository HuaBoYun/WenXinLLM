server:
  port: 8081
spring:
  profiles:
    active: dev
  application:
    name: hbyunCyberMonitor

# 报告导出配置
report:
  export:
    path: /tmp/reports

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: jdbc:dm://127.0.0.1:5236/SYSDBA?zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=utf-8
    username: SYSDBA
    password: REDACTED
    driver-class-name: dm.jdbc.driver.DmDriver
  druid:
    initialSize: 5
    minIdle: 5
    maxActive: 20
    maxWait: 60000
    timeBetweenEvictionRunsMillis: 60000
    minEvictableIdleTimeMillis: 300000
    validationQuery: SELECT 1
    testWhileIdle: true
    testOnBorrow: false
    testOnReturn: false
    poolPreparedStatements: true
    maxPoolPreparedStatementPerConnectionSize: 20
    filters: stat,wall
  main:
    allow-circular-references: true
  springdoc:
    swagger-ui:
      enabled: true
    api-docs:
      enabled: true
  redis: 
    host: 127.0.0.1
    port: 6379
    password:
logging:
  level:
    root: INFO
    # 临时开启 MyBatis-Plus SQL 日志，用于排查融资记录新增/更新时 termMonths/remark 是否落库
    # 排查完成后可注释掉下一行
    com.huabo.cybermonitor.mapper: DEBUG

# 跨服务调用配置（HttpClient 直连方式，不依赖 Eureka）
contract:
  service:
    url: http://127.0.0.1:8064    # 内部合同模块地址
risk-control:
  service:
    url: http://127.0.0.1:8763    # 风控服务地址
finance:
  service:
    url: http://127.0.0.1:8763    # 数据采集服务地址

# MyBatis-Plus 配置
mybatis-plus:
  type-aliases-package: com.huabo.cybermonitor.entity
  mapper-locations: classpath:com/huabo/cybermonitor/mapper/xml/*.xml
  configuration:
    map-underscore-to-camel-case: true

# PageHelper 分页配置（达梦数据库使用oracle方言）
pagehelper:
  helperDialect: oracle
  reasonable: false
  supportMethodsArguments: true
  params: count=countSql

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

# ============================================================
# 计费系统配置
# ============================================================
billing:
  # 计费模式切换（二选一）：
  #   cloud   = 云端版：只记录计费，余额不足时登录弹窗提示，不阻断使用
  #   offline = 离线版：余额不足时阻断登录，必须密钥充值后才能使用
  mode: cloud
  enabled: true              # 是否启用计费（false=关闭所有计费）
  deduplicate-seconds: 10    # 防重复计费时间窗口（秒）
  default-fee-amount: 1.0    # 未配置单价的页面默认计费金额（元/次）

