spring:
 main:
  allow-bean-definition-overriding: true
 application:
  name: hbyunCyberMonitor #应用名称
 datasource:
  type: com.alibaba.druid.pool.DruidDataSource
  url: jdbc:dm://127.0.0.1:5236/SYSDBA?zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
  username: SYSDBA
  password: REDACTED
  driverClassName: dm.jdbc.driver.DmDriver
 druid:
  initialSize: 5
  minIdle: 5
  maxActive: 20
  maxWait: 60000
  timeBetweenEvictionRunsMillis: 60000
  minEvictableIdleTimeMillis: 300000
  validationQuery: SELECT 1 FROM DUAL
  testWhileIdle: true
  testOnBorrow: false
  testOnReturn: false
  poolPreparedStatement: true
  maxPoolPreparedStatementPerConnectionSize: 20
  filters: stat,wall,log4j
  connectionProperties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
 redis:
  host: 127.0.0.1
  port: 6379
  password: REDACTED

#eureka服务注册中心配置
eureka:
 instance:
  ip-address: 127.0.0.1
  instance-id: hbyunCyberMonitor-8081
  prefer-ip-address: true
  hostname: hbyun-cyberMonitor-service
 client:
  register-with-eureka: true
  fetch-registry: true
  serviceUrl:
   defaultZone: http://hbyunadmin:REDACTED@127.0.0.1:8761/eureka
security:
 basic:
  enabled: false

acurl: http://127.0.0.1:8003
formurl: http://127.0.0.1:8001
activitiModelerUrl: http://127.0.0.1:8137
getOrgChildrenUrl: http://127.0.0.1:8379
insertOrgOneUrl: http://127.0.0.1:8379
redisurl: http://127.0.0.1:8379
# 网关地址（服务间内部调用统一走 Gateway）
gateway:
  url: http://127.0.0.1:9000

mybatis:
 configuration:
  map-underscore-to-camel-case: true

logging:
 level:
  com:
   huabo:
    contract:
     mapper: debug

