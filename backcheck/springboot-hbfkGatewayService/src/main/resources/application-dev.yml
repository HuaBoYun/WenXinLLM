#eureka 配置

eureka:
  client:
    service-url:
      #eureka 服务注册中心
      defaultZone: http://hbyunadmin:REDACTED@127.0.0.1:8761/eureka
  instance:
    # 指定自己的ip信息，不指定的话会自己寻找
    ip-address: 127.0.0.1
    # 执行当前服务的应用ID  不可以重复  标识的是每一个具体的的服务
    instance-id: hbfkGateWayService-9000
    # 当调用getHostname获取实例的hostname时，返回ip而不是host名称
    prefer-ip-address: true
    #实例主机名
    hostname: hbfk-gateWay-server

#日志配置
logging:
  level:
    org:
      springframework:
        cloud:
          gateway: debug

application:
  #文件上传
  file-upload:
    base-dir: D:\nginx-1.20.2\html\hbfk
    base-url: http://127.0.0.1/hbfk
