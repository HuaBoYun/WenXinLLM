spring:
  application:
    name: hbyunFinancialSharingModule #应用名称
  main:
    allow-bean-definition-overriding: true
  # Jackson日期时间序列化配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    # 支持Java 8时间类型
    modules:
      - com.fasterxml.jackson.datatype.jsr310.JavaTimeModule
  # 达梦数据库配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: jdbc:dm://127.0.0.1:5236/SYSDBA?zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=utf-8
    username: SYSDBA
    password: REDACTED
    driver-class-name: dm.jdbc.driver.DmDriver
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1 FROM DUAL
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall,log4j
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
    # MySQL数据源配置（用于付款管理等模块）
    mysql:
      type: com.alibaba.druid.pool.DruidDataSource
      url: jdbc:dm://127.0.0.1:5236/SYSDBA?zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=utf-8
      username: SYSDBA
      password: REDACTED
      driver-class-name: dm.jdbc.driver.DmDriver
      druid:
        initial-size: 5
        min-idle: 5
        max-active: 20
        max-wait: 60000
        time-between-eviction-runs-millis: 60000
        min-evictable-idle-time-millis: 300000
        validation-query: SELECT 1 FROM DUAL
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
        pool-prepared-statements: true
        max-pool-prepared-statement-per-connection-size: 20
        filters: stat,wall,log4j
        connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
  # Redis配置
  redis:
    host: 127.0.0.1
    port: 6379
    timeout: 3000ms
    password:


#eureka服务注册中心配置
eureka:
 instance:
  ip-address: 127.0.0.1
  instance-id: hbyunFinancialSharingModule-8682
  prefer-ip-address: true
  hostname: hbyunFinancialSharingModule-service
 client:
  serviceUrl:
   defaultZone: http://hbyunadmin:REDACTED@127.0.0.1:8761/eureka
security:
  basic:
    enabled: false

# Redis配置
redisAddressIp: 127.0.0.1
redisAddressPort: 6379
redisPwd:
redisMaxTotal: 512
redisMaxIdle: 100
redisMaxWait: 10000
redisTimeOut: 1000
redisTextonBorrow: true


mybatis:
 configuration:
  map-underscore-to-camel-case: true

mybatis-plus:
  mapper-locations: classpath*:oracle/*.xml,classpath*:oracle/mapper/*.xml,classpath*:mapper/*.xml,classpath*:mapper/**/*.xml
  type-aliases-package: com.financial.sharing.oracle.entity
  config-location: classpath:mybatis-config.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: is_deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Swagger配置
swagger:
 enabled: true
 # 是否开启swagger
 # 请求前缀
 pathMapping:
application:
 #文件上传
 file-upload:
  base-dir: D:\nginx-1.20.2\html\hbfk
  #base-url: http://192.0.2.200/hbfk
  base-url: http://192.0.2.13/hbfk

file:
 path: C:\HBFK\PRO\www\apache-tomcat-7.0.65\webapps\ROOT\WEB-INF\

fwgl:
 belongGroupName: 国有资产监督管理委员会
 legalPersonnel: 法务人员

# 数据库兼容性配置
database:
 compatibility:
  enabled: true
  type: dameng
  auto-convert-sql: true
  log-sql-conversion: true

# PageHelper 分页插件配置
pagehelper:
  helper-dialect: oracle  # 达梦数据库使用Oracle方言
  auto-runtime-dialect: false  # 禁用自动运行时方言检测
  reasonable: true  # 启用合理化参数
  support-methods-arguments: true  # 支持通过Mapper接口参数传递分页参数
  page-size-zero: true  # 当pageSize=0时查询全部结果
  params: count=countSql;pageSize=pageSize;pageNum=pageNumber  # 分页参数映射，修复为前端传递的参数名
