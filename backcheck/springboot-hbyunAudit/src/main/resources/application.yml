server:
  port: 8065

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  springdoc:
    swagger-ui:
      enabled: true
    api-docs:
      enabled: true
      
      
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

# ============================================================
# HttpClient 连接池配置
# ============================================================
# 说明：
# 1. maxTotal: 整个连接池的最大连接数，建议 200-500
# 2. maxPerRoute: 每个路由（目标主机）的最大连接数，建议 20-50
# 3. connectTimeout: 建立连接的超时时间（毫秒），建议 5000
# 4. socketTimeout: 等待响应的超时时间（毫秒），建议 30000
# 5. connectionRequestTimeout: 从连接池获取连接的超时时间（毫秒），建议 5000
# ============================================================
http-client:
  max-total: 200                    # 最大连接数
  max-per-route: 20                 # 每个路由最大连接数
  connect-timeout: 5000             # 连接超时（毫秒）
  socket-timeout: 30000             # 读超时（毫秒）
  connection-request-timeout: 5000  # 从连接池获取连接超时（毫秒）

